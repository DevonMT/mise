name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      # ONLY Lite ships here now.
      #
      # The personal edition used to be published at /mise/ as well, and having
      # two installable copies of the same app was the whole problem: IndexedDB
      # is per-ORIGIN, so the two copies on this domain shared one database
      # while the copy on mise.devondoes.dev had its own — and only that one can
      # sync, because a browser will only hand it the platform session cookie.
      # The result was a personal app whose data was in whichever copy you
      # happened to open. The personal edition now lives at
      # https://mise.devondoes.dev and nowhere else.
      - run: npx vite build
        env:
          BASE_PATH: /mise/
          VITE_MISE_EDITION: lite
      # /mise/lite/ was Lite's address for months. Anything bookmarked or
      # installed there keeps working; it just lands on /mise/ now.
      - name: Keep the old /mise/lite/ URL alive
        run: |
          mkdir -p dist/lite
          cat > dist/lite/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Mise Lite</title>
          <meta http-equiv="refresh" content="0; url=/mise/">
          <link rel="canonical" href="/mise/">
          <p>Mise Lite has moved to <a href="/mise/">/mise/</a>.</p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
