name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # NOTHING IS BUILT FOR THIS DOMAIN ANY MORE.
      #
      # devontroedel.com is a site about Devon; devondoes.dev is where things
      # run. Mise lives only at https://mise.devondoes.dev, where the edition
      # you get comes from your account rather than from which copy you opened.
      #
      # What ships here is a rescue page, not a redirect. IndexedDB is
      # per-ORIGIN, so lists created at this address are still in the visitor's
      # browser under devontroedel.com — serving a 404 or a redirect would leave
      # them unreachable without deleting them. The page reads what is there,
      # hands it over as the app's own backup format, unregisters the old
      # service worker so no cached ghost of Mise keeps running here, and only
      # then points at the new address.
      - name: Publish the rescue page at /mise/ and /mise/lite/
        run: |
          mkdir -p dist/lite
          cp retire/index.html dist/index.html
          cp retire/index.html dist/lite/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
